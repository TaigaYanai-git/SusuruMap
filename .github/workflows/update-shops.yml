name: Update Shop Data

# 毎週月曜 3:00 (JST) に SUSURU TV. の新着動画を取り込み、検査に通れば main に直接反映する。
# アプリは起動時に main の shops.json を読むので、アプリを作り直さなくても最新になる。
# 必要な設定:
#   - Settings > Secrets and variables > Actions に YOUTUBE_API_KEY
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch videos & rebuild shops.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/fetch_susuru_shops.py
      - name: Validate
        run: python3 tools/validate_shops.py
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SusuruMap/Resources/shops.json data/geocode_cache.json data/unresolved.csv
          if git diff --cached --quiet; then
            echo "新しい店舗はありませんでした"
          else
            git commit -m "data: SUSURU TV. の新着動画から店舗データを更新"
            git push
          fi
