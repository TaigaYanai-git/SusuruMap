name: Shop Data Check

on:
  pull_request:
    paths:
      - "SusuruMap/Resources/shops.json"
      - "data/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - "SusuruMap/Resources/shops.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shops.json
        run: python3 tools/validate_shops.py
