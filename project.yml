name: SusuruMap

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    # ── バージョン ──────────────────────────────────────────
    # 変更は scripts/bump_version.py で行う（CHANGELOG と tag の整合を取るため）
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  SusuruMap:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: SusuruMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).susurumap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: SusuruMap/Info.plist
      properties:
        CFBundleDisplayName: すするマップ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 現在地の近くにあるラーメン店を表示するために使います。
        NSCalendarsWriteOnlyAccessUsageDescription: ラーメン店に行った日をカレンダーに登録するために使います。
        SHOPS_DATA_URL: $(SHOPS_DATA_URL)
        REPO_URL: $(REPO_URL)
        # CloudKit の変更通知を受けてバックグラウンドで同期するため
        UIBackgroundModes: [remote-notification]

schemes:
  SusuruMap:
    build:
      targets:
        SusuruMap: all
    run:
      config: Debug
    archive:
      config: Release
